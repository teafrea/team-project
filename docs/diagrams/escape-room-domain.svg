<svg xmlns="http://www.w3.org/2000/svg" width="2250" height="1470" viewBox="0 0 2250 1470" role="img" aria-labelledby="title desc"><title id="title">Escape Room Adventure — story templates, scene interactions and puzzle types</title><desc id="desc">A game session uses one story template and contains rooms. Rooms contain scene objects, clues, items, exits and puzzles. A scene object offers interactions, including actions without an inventory item. InteractionPuzzle and DeductionPuzzle specialize Puzzle. Per-game generated values keep clue text and expected answers consistent.</desc><defs><marker id="triangle" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 15 8 1 15z" fill="white" stroke="black" stroke-width="1.2"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:black}.name{font-size:19px;font-weight:bold}.label{font-size:16px}.edge{fill:none;stroke:black;stroke-width:1.2}</style><rect width="2250" height="1470" fill="white"/>
